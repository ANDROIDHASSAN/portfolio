.0" y1="134" x2="420.0" y2="140" stroke="#59636e"/><text x="420.0" y="154" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">400 ms</text><line x1="610.0" y1="134" x2="610.0" y2="140" stroke="#59636e"/><text x="610.0" y="154" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">600 ms</text><line x1="800.0" y1="134" x2="800.0" y2="140" stroke="#59636e"/><text x="800.0" y="154" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">800 ms</text><line x1="230.0" y1="70" x2="230.0" y2="130" stroke="#1f2328" stroke-dasharray="3 3" opacity=".6"/><text x="24" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#59636e">Humans reply in ~200 ms (dashed line). End-of-turn eats the biggest slice, so I am building a Hinglish turn detector.</text></svg>