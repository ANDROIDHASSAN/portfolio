ke="#30363d" stroke-width="1.2"/><text x="743.0" y="128.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#e6edf3">TTS</text><text x="743.0" y="144.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#8b949e">streamed</text><line class="flow" x1="670" y1="132" x2="694" y2="132" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><path class="flow" d="M743 160 V184 H228 V184" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><text x="452" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#8b949e">reply audio streams back · barge-in cancels it</text><rect x="336" y="212" width="214" height="56" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><text x="443.0" y="236.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#e6edf3">GUARDS</text><text x="443.0" y="252.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#8b949e">script-aware text match · feature flags</text><rect x="566" y="212" width="236" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="684.0" y="236.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#e6edf3">INTERVIEW LOGIC</text><text x="684.0" y="252.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#8b949e">question plan · follow-ups · tool calls</text><line class="" x1="623.0" y1="160" x2="623.0" y2="210" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="312" width="380" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="214.0" y="332.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#e6edf3">CI/CD</text><text x="214.0" y="348.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#8b949e">GitHub Actions → Docker → LiveKit Cloud</text><rect x="420" y="312" width="396" height="48" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><text x="618.0" y="332.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" fill="#e6edf3">SCALE</text><text x="618.0" y="348.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#8b949e">1,000+ concurrent interviews · 42+ languages</text><text x="816" y="374" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#8b949e">green = where Indian speech broke, and what I fixed</text></svg>