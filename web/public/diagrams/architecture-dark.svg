<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-label="Architecture of a real-time voice interviewer: candidate connects over WebRTC to a LiveKit room; a Python agent worker runs VAD, Sarvam STT, GPT-4.1 with tools and streamed TTS, with script-aware guards and feature flags; deployed via GitHub Actions and Docker to LiveKit Cloud; 1,000+ concurrent interviews in 42+ languages.">
<style>.flow{stroke-dasharray:5 6;animation:dash 1.1s linear infinite}
